name: CI

on:
  pull_request:
    branches: [uat, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: complaint_system_new_testing
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, zip
          coverage: none

      - run: composer install --no-progress --prefer-dist

      - run: cp .env.example .env
      - run: php artisan key:generate

      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: complaint_system_new_testing
          DB_USERNAME: root
          DB_PASSWORD: ""

      - run: ./vendor/bin/pint --test
